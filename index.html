<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modanimo</title>
<meta name="description" content="Modanimo">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --dim: #5e5c58; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: 'Syne', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- background layers ---------- */
  .layer { position: fixed; pointer-events: none; }

  /* Film grain */
  .grain {
    inset: -50%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: .06;
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-3%, 2%); }
    40%  { transform: translate(2%, -3%); }
    60%  { transform: translate(-2%, -1%); }
    80%  { transform: translate(3%, 3%); }
    100% { transform: translate(0, 0); }
  }

  /* Edge darkening */
  .vignette { inset: 0; background: radial-gradient(ellipse at center, transparent 35%, #000 95%); }

  /* ---------- title ---------- */
  h1 {
    position: relative; z-index: 2;
    color: var(--dim);
    font-weight: 600;
    font-size: clamp(2.2rem, 9vw, 7rem);
    letter-spacing: .2em;
    padding-left: .2em;          /* balances trailing letter-spacing so it centers */
    text-transform: uppercase;
    user-select: none;
    white-space: nowrap;
    animation: breathe 7s ease-in-out 2.6s infinite;
  }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 0 rgba(255,255,255,0); }
    50%      { text-shadow: 0 0 28px rgba(255,255,255,.08); }
  }

  /* Letters rise in one by one */
  h1 span {
    display: inline-block;
    opacity: 0;
    transform: translateY(.25em);
    animation: rise 1.6s cubic-bezier(.2, .7, .2, 1) forwards;
    animation-delay: calc(.4s + var(--i) * .12s);
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* Slow light sweep across the letters */
  h1::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    padding-left: .2em;
    background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%);
    background-size: 300% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: sheen 9s ease-in-out 2.6s infinite;
  }
  @keyframes sheen {
    0%   { background-position: 100% 0; }
    55%  { background-position: 0% 0; }
    100% { background-position: 0% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    h1 span { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="layer grain"></div>
  <div class="layer vignette"></div>

  <h1 data-text="Modanimo" aria-label="Modanimo"><span style="--i:0">M</span><span style="--i:1">o</span><span style="--i:2">d</span><span style="--i:3">a</span><span style="--i:4">n</span><span style="--i:5">i</span><span style="--i:6">m</span><span style="--i:7">o</span></h1>
</body>
</html>
